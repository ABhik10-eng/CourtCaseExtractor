<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court Case Management Intel</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-6 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900 text-center mb-1">⚖️ Court Intelligence Hub</h1>
        <p class="text-xs text-gray-500 text-center mb-6">Cross-reference Cause Lists and Transfer Lists dynamically by Case and Counsel details.</p>

        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-5">
            <!-- Dual Search Parameters Block -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="search_name" class="block text-xs font-semibold text-gray-700 mb-1">Counsel / Party Name</label>
                    <input type="text" id="search_name" name="search_name" required placeholder="e.g. Parvesh Kumar" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                <div>
                    <label for="case_number" class="block text-xs font-semibold text-gray-700 mb-1">Specific Case Number (Optional)</label>
                    <input type="text" id="case_number" name="case_number" placeholder="e.g. WRIC/38579/2026" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
            </div>

            <!-- Double Document Input Fields Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Field A: Cause List -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Primary Daily Cause List PDF</label>
                    <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 p-2">
                        <div class="text-center">
                            <p class="text-xs text-gray-600 font-medium" id="label-cause">Tap to select Cause List</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">PDF Format only</p>
                        </div>
                        <input type="file" name="cause_pdf" id="cause_pdf" accept=".pdf" required class="hidden" onchange="updateLabel('cause_pdf', 'label-cause')" />
                    </label>
                </div>

                <!-- Field B: Transfer List -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Judicial Reshuffle / Transfer PDF</label>
                    <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 p-2">
                        <div class="text-center">
                            <p class="text-xs text-gray-600 font-medium" id="label-transfer">Tap to select Transfer List</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">PDF Format only</p>
                        </div>
                        <input type="file" name="transfer_pdf" id="transfer_pdf" accept=".pdf" required class="hidden" onchange="updateLabel('transfer_pdf', 'label-transfer')" />
                    </label>
                </div>
            </div>

            <!-- Submit Engine Action -->
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-4 rounded-xl transition duration-150 text-sm shadow-md">
                Cross-Reference Docs & Generate Intel Report
            </button>
        </form>
    </div>

    <script>
        function updateLabel(inputId, labelId) {
            const input = document.getElementById(inputId);
            const label = document.getElementById(labelId);
            if (input.files.length > 0) {
                label.innerText = "✓ Selected: " + input.files[0].name.substring(0, 20) + "...";
                label.classList.add("text-emerald-600");
            }
        }
    </script>
</body>
</html>
