<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Court Case Management & Filter System</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-6 md:p-8 border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">⚖️ High Court Smart Case Diary</h1>
            <p class="text-xs text-slate-500 max-w-md mx-auto">Upload any Allahabad HC Cause List or Official Transfer Notification. The parser extracts hearing dates, locations, matching personnel, and counsel names automatically.</p>
        </div>

        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-5">
            <!-- Name Input Field -->
            <div>
                <label for="search_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Target Name / Officer Name</label>
                <input type="text" id="search_name" name="search_name" required placeholder="Enter name to extract (e.g. John Doe)" 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50/50 text-sm">
            </div>

            <!-- Compact File Upload Field -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Upload Document (PDF)</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-slate-200 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100/70 p-4 transition">
                        <div class="flex flex-col items-center justify-center text-center">
                            <svg style="width: 32px; height: 32px; margin-bottom: 8px; color: #64748B;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p class="text-xs text-slate-600 font-semibold" id="file-label">Tap to upload Cause List or Transfer List</p>
                            <p class="text-[10px] text-slate-400 mt-1">PDF file format only</p>
                        </div>
                        <input type="file" name="pdf_file" id="pdf_file" accept=".pdf" required class="hidden" onchange="updateFileName()" />
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 px-4 rounded-xl transition duration-200 text-sm shadow-md tracking-wide">
                Run Extraction & Generate Smart Report
            </button>
        </form>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('pdf_file');
            const label = document.getElementById('file-label');
            if (input.files.length > 0) {
                label.innerText = "Selected: " + input.files[0].name;
                label.classList.add("text-blue-600");
            }
        }
    </script>
</body>
</html>
