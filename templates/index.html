<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Court Case Extractor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white shadow-md rounded-xl p-6 md:p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">⚖️ Court Case PDF Filter</h1>
        <p class="text-sm text-gray-500 text-center mb-6">Upload the cause list or case list PDF, type your name, and generate a customized PDF table instantly.</p>

        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-5">
            <!-- Name Input Field -->
            <div>
                <label for="search_name" class="block text-sm font-semibold text-gray-700 mb-2">Search Name</label>
                <input type="text" id="search_name" name="search_name" required placeholder="Enter full name (e.g. John Doe)" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-base">
            </div>

            <!-- Mobile-Friendly File Upload Field -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Court List PDF</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 p-4">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center">
                            <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <p class="text-sm text-gray-500 font-medium" id="file-label">Tap to upload or drag & drop</p>
                            <p class="text-xs text-gray-400 mt-1">PDF file only</p>
                        </div>
                        <input type="file" name="pdf_file" id="pdf_file" accept=".pdf" required class="hidden" onchange="updateFileName()" />
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-sm focus:ring-4 focus:ring-blue-200">
                Extract & Download PDF Table
            </button>
        </form>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('pdf_file');
            const label = document.getElementById('file-label');
            if (input.files.length > 0) {
                label.innerText = "Selected: " + input.files[0].name;
                label.classList.add("text-blue-600");
            }
        }
    </script>
</body>
</html>
